<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Queen Team-Up</title>
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="Queen Team-Up lily-pad pond"></canvas>

    <div id="screen-title" class="screen">
      <h1>Queen Team-Up</h1>
      <p>Jump the lily pads across the pond. Join the mermaid. Gugu is fire.</p>
      <button type="button" id="btn-start">Play</button>
      <p class="nav"><a href="../../#demo">Back to the gallery</a></p>
    </div>

    <div id="screen-pick" class="screen hidden">
      <h1>Pick three friends</h1>
      <p>The first friend is who you jump with. The other two are extra lives if you fall in.</p>
      <div id="roster" class="roster"></div>
      <button type="button" id="btn-pond" disabled>To the pond</button>
    </div>

    <header id="hud" class="hidden">
      <div class="hud-brand">
        <div class="brand">Queen Team-Up</div>
        <div id="lives" aria-label="Team"></div>
      </div>
      <p id="hint" aria-live="polite"></p>
    </header>

    <div id="fight" class="hidden" aria-label="Elements">
      <span>Gugu is fire</span>
      <button type="button" data-el="air">1 Air</button>
      <button type="button" data-el="water">2 Water</button>
      <button type="button" data-el="plant">3 Plant</button>
    </div>

    <div id="banner" class="hidden" aria-live="assertive"></div>

    <div id="finish" class="hidden">
      <div class="finish-panel">
        <p class="finish-title" id="end-title">The end!</p>
        <p class="finish-line" id="end-text"></p>
        <button type="button" id="btn-again">Play again</button>
      </div>
    </div>

    <div id="loading">Setting up the pond…</div>

    <div id="touch">
      <button type="button" id="t-left" aria-label="Left">◀</button>
      <button type="button" id="t-right" aria-label="Right">▶</button>
      <button type="button" id="t-jump" aria-label="Jump">Jump</button>
    </div>
  </div>
  <script type="module" src="js/game.js?v=5"></script>
</body>
</html>
