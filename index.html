<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isabel Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=18" />
</head>
<body class="section-comics mode-comic">
  <nav id="topnav" aria-label="Isabel Art">
    <p class="brand">Isabel Art</p>
    <div class="sections" role="tablist">
      <a href="#comics" id="nav-comics" class="section-link" aria-current="page">Comics</a>
      <a href="#novels" id="nav-novels" class="section-link">Novels</a>
      <a href="#songs" id="nav-songs" class="section-link">Songs</a>
      <a href="#gallery" id="nav-gallery" class="section-link">Gallery</a>
      <a href="#demo" id="nav-demo" class="section-link">Demo</a>
    </div>
  </nav>

  <aside id="shelf">
    <p class="kicker" id="shelf-kicker">Comics</p>
    <h1 id="shelf-title">Books</h1>
    <p class="lede" id="shelf-lede">Isabel’s notebook pages, plus crayon versions.</p>
    <nav id="list"></nav>
  </aside>

  <main>
    <header>
      <div>
        <p id="item-kicker">Choose a book</p>
        <h2 id="item-title">Isabel Art</h2>
      </div>
      <div class="tools">
        <div class="tabs tabs-soft" id="comic-tabs" role="tablist" aria-label="Notebook or comic book">
          <button type="button" id="tab-converted" role="tab" aria-selected="true" aria-label="Comic book pages">Comic book</button>
          <button type="button" id="tab-original" role="tab" aria-selected="false" aria-label="Notebook pages">Notebook</button>
        </div>
        <div class="tabs tabs-soft tabs-crayon hidden" id="gallery-tabs" role="tablist" aria-label="Gallery art type">
          <button type="button" id="tab-characters" role="tab" aria-selected="true">Characters</button>
          <button type="button" id="tab-elements" role="tab" aria-selected="false">Elements</button>
          <button type="button" id="tab-backgrounds" role="tab" aria-selected="false">Backgrounds</button>
          <button type="button" id="tab-styles" role="tab" aria-selected="false">Styles</button>
        </div>
        <div class="pager" id="pager">
          <button type="button" id="prev" aria-label="Previous">←</button>
          <span id="pos">0 / 0</span>
          <button type="button" id="next" aria-label="Next">→</button>
        </div>
      </div>
    </header>

    <div id="stage-comic" class="stage stage-storybook">
      <figure class="page-mat">
        <div class="mat-frame">
          <img id="page" alt="Comic page" />
        </div>
        <figcaption id="caption"></figcaption>
      </figure>
    </div>

    <div id="stage-song" class="stage hidden">
      <img id="song-picture" alt="Song picture" />
      <pre id="song-lyrics"></pre>
    </div>

    <article id="stage-novel" class="stage hidden"></article>

    <div id="stage-demo" class="stage hidden" aria-label="Playable demos">
      <div id="demo-play" class="demo-play">
        <iframe id="demo-iframe" title="Playable demo" loading="lazy"></iframe>
      </div>
    </div>

    <div id="stage-gallery" class="stage stage-shelf hidden">
      <div class="gallery-stage">
        <div class="gallery-preview-dock" id="gallery-focus-panel" aria-live="polite" hidden>
          <figure class="gallery-focus hidden" id="gallery-focus">
            <img id="gallery-page" alt="" />
            <figcaption id="gallery-caption"></figcaption>
          </figure>
        </div>
        <div class="gallery-scroll">
          <p class="gallery-shelf-lede" id="gallery-shelf-lede"></p>
          <div id="gallery-grid" role="list"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js?v=18"></script>
</body>
</html>
